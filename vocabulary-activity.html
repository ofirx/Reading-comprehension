<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Activity 1 — Vocabulary</title>
    <style>
      :root {
        --bg: #f4f6fb;
        --card: #fff;
        --text: #1e1b24;
        --muted: #5c5668;
        --border: rgba(30, 27, 36, 0.12);
        --radius: 14px;
        --shadow: 0 10px 28px rgba(30, 27, 36, 0.08);
        --learn: #2e9b5a;
        --learn-dark: #1f7a45;
        --flash: #6b4c9a;
        --flash-dark: #553d7c;
        --test: #2563eb;
        --test-dark: #1d4ed8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
      }
      .wrap {
        max-width: 720px;
        margin: 0 auto;
        padding: 16px 14px 24px;
      }
      .intro {
        background: #e8eaef;
        border-radius: var(--radius);
        padding: 14px 16px;
        margin-bottom: 16px;
        font-size: 15px;
      }
      .intro u {
        font-weight: 800;
      }
      .word-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 14px;
      }
      .word-tab {
        flex: 1 1 calc(33.333% - 8px);
        min-width: 96px;
        padding: 10px 8px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--card);
        font: inherit;
        font-weight: 700;
        font-size: 13px;
        cursor: pointer;
      }
      .word-tab.is-active {
        background: #f28c28;
        border-color: #d96d00;
        color: #fff;
      }
      .panel {
        display: none;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 16px;
      }
      .panel.is-active {
        display: block;
      }
      .panel-head {
        text-align: center;
        margin-bottom: 14px;
      }
      .panel-head h2 {
        margin: 0 0 10px;
        font-size: 1.35rem;
        color: var(--flash);
      }
      .panel-img {
        width: 100%;
        max-height: 200px;
        object-fit: contain;
        border-radius: 10px;
        background: #f0f2f6;
      }
      .mode-btns {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        margin-bottom: 14px;
      }
      .mode-btn {
        padding: 10px 18px;
        border: 2px solid transparent;
        border-radius: 999px;
        background: #eef1f6;
        font: inherit;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
        color: var(--text);
      }
      .mode-btn[data-mode="learn"].is-active {
        background: var(--learn);
        border-color: var(--learn-dark);
        color: #fff;
      }
      .mode-btn[data-mode="flashcards"].is-active {
        background: var(--flash);
        border-color: var(--flash-dark);
        color: #fff;
      }
      .mode-btn[data-mode="test"].is-active {
        background: var(--test);
        border-color: var(--test-dark);
        color: #fff;
      }
      .mode-panel {
        display: none;
      }
      .mode-panel.is-active {
        display: block;
      }
      .section-block {
        border-radius: 12px;
        padding: 14px;
        margin-bottom: 12px;
      }
      .section-learn {
        background: rgba(46, 155, 90, 0.08);
        border: 1px solid rgba(46, 155, 90, 0.25);
      }
      .section-flashcards {
        background: rgba(107, 76, 154, 0.08);
        border: 1px solid rgba(107, 76, 154, 0.25);
      }
      .section-test {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.25);
      }
      .instr-en {
        margin: 0 0 6px;
        font-size: 14px;
      }
      .instr-he {
        margin: 0 0 12px;
        font-size: 14px;
        direction: rtl;
        text-align: right;
        color: var(--muted);
      }
      .start-btn,
      .restart-btn,
      .test-nav-btn {
        display: inline-block;
        margin: 4px 6px 4px 0;
        padding: 11px 22px;
        border: none;
        border-radius: 999px;
        font: inherit;
        font-weight: 800;
        font-size: 14px;
        cursor: pointer;
        color: #fff;
      }
      .start-btn--learn {
        background: var(--learn);
      }
      .start-btn--learn:hover {
        background: var(--learn-dark);
      }
      .start-btn--flash {
        background: var(--flash);
      }
      .start-btn--flash:hover {
        background: var(--flash-dark);
      }
      .start-btn--test {
        background: var(--test);
      }
      .start-btn--test:hover {
        background: var(--test-dark);
      }
      .restart-btn {
        background: #5c5668;
        font-size: 13px;
        padding: 8px 16px;
      }
      .restart-btn:hover {
        background: #403a48;
      }
      .section-content {
        display: none;
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px dashed rgba(30, 27, 36, 0.15);
      }
      .section-content.is-open {
        display: block;
      }
      .sentence-pair {
        margin: 0 0 12px;
        padding: 12px;
        border-radius: 10px;
        background: #fff;
        border: 1px solid var(--border);
      }
      .sentence-pair p {
        margin: 0 0 6px;
      }
      .sentence-pair .he-rtl {
        margin: 0;
        direction: rtl;
        text-align: right;
        color: var(--flash);
        font-weight: 650;
      }
      .meaning-block {
        margin-bottom: 12px;
      }
      .flashcard {
        perspective: 900px;
        max-width: 360px;
        margin: 0 auto 12px;
        min-height: 280px;
      }
      .flashcard-inner {
        position: relative;
        width: 100%;
        min-height: 280px;
        transition: transform 0.45s;
        transform-style: preserve-3d;
        cursor: pointer;
      }
      .flashcard.is-flipped .flashcard-inner {
        transform: rotateY(180deg);
      }
      .flashcard-face {
        position: absolute;
        inset: 0;
        backface-visibility: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 18px;
        border-radius: 12px;
        border: 2px solid var(--flash);
        background: #fff;
        text-align: center;
      }
      .flashcard-back {
        transform: rotateY(180deg);
      }
      .flashcard-word {
        font-size: 1.75rem;
        font-weight: 800;
        color: var(--flash);
      }
      .flashcard-back .flashcard-word-en {
        margin: 0 0 14px;
        font-size: 1.75rem;
        font-weight: 800;
        color: var(--text);
      }
      .flashcard-back .flashcard-meaning-he {
        margin: 0;
        font-size: 1.35rem;
        font-weight: 750;
        color: var(--flash);
        direction: rtl;
        text-align: center;
        line-height: 1.45;
      }
      .flashcard-hint {
        font-size: 13px;
        color: var(--muted);
        text-align: center;
        margin-bottom: 8px;
      }
      .flash-progress {
        text-align: center;
        font-size: 13px;
        font-weight: 700;
        color: var(--flash);
        margin: 0 0 10px;
      }
      .flash-deck-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }
      .flash-deck-card-wrap {
        flex: 1;
        min-width: 0;
      }
      .flash-next-btn {
        flex: 0 0 auto;
        align-self: center;
        padding: 14px 20px;
        border: 1px solid rgba(217, 109, 0, 0.45);
        border-radius: 12px;
        background: #f28c28;
        color: #fff;
        font: inherit;
        font-weight: 800;
        font-size: 15px;
        cursor: pointer;
        white-space: nowrap;
        box-shadow: 0 8px 22px rgba(242, 140, 40, 0.4);
      }
      .flash-next-btn:hover {
        background: #d96d00;
      }
      .flash-next-btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .flash-deck-footer {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      @media (max-width: 520px) {
        .flash-deck-row {
          flex-direction: column;
        }
        .flash-next-btn {
          width: 100%;
        }
      }
      .he-block {
        width: 100%;
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px dashed rgba(107, 76, 154, 0.4);
        direction: rtl;
        text-align: right;
      }
      .he-word {
        font-size: 1.25rem;
        font-weight: 800;
        color: var(--flash);
      }
      .test-progress {
        font-size: 13px;
        font-weight: 700;
        color: var(--test);
        margin-bottom: 10px;
      }
      .test-word-tag {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(37, 99, 235, 0.12);
        font-size: 12px;
        margin-bottom: 8px;
      }
      .test-options {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin: 10px 0;
      }
      .test-options label {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #fff;
        cursor: pointer;
      }
      .test-options label:has(input:checked) {
        border-color: var(--learn);
        background: rgba(46, 155, 90, 0.08);
      }
      .test-feedback {
        margin: 8px 0;
        font-weight: 700;
        min-height: 1.3em;
      }
      .test-feedback.is-ok {
        color: var(--learn);
      }
      .test-feedback.is-bad {
        color: #c62828;
      }
      .test-nav-btn {
        background: var(--test);
      }
      .test-nav-btn:hover {
        background: var(--test-dark);
      }
      .test-nav-btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .test-done {
        padding: 12px;
        border-radius: 10px;
        background: rgba(46, 155, 90, 0.12);
        font-weight: 700;
        color: var(--learn-dark);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <p class="intro" lang="en">
        <u>Activity 1</u>: Choose a word. For each part — <strong>Learn</strong>, <strong>Flashcards</strong>,
        <strong>Test</strong> — read the instructions and press <strong>Start</strong>. Good luck! 🙂
      </p>

      <div class="word-tabs" role="tablist" aria-label="Vocabulary words">
        <button type="button" class="word-tab is-active" data-word="meet">Meet</button>
        <button type="button" class="word-tab" data-word="name">Name</button>
        <button type="button" class="word-tab" data-word="phone">Phone- number</button>
        <button type="button" class="word-tab" data-word="address">Address</button>
        <button type="button" class="word-tab" data-word="pencil">Pencil</button>
        <button type="button" class="word-tab" data-word="food">Food</button>
      </div>

      <div id="panels"></div>
    </div>

    <script>
      (function () {
        var BASE = "assets/vocabulary/";
        var WORDS = [
          {
            id: "meet",
            label: "Meet",
            img: BASE + "meet.png",
            meaning: "To see someone and say hello for the first time.",
            meaningHe: "להכיר מישהו ולהגיד שלום",
            labelHe: "להכיר",
            sentences: [
              { en: "It's nice to meet you.", he: "נעים להכיר." },
              { en: "I'm your new English teacher. It's nice to meet you.", he: "אני המורה החדשה שלכם לאנגלית. נעים להכיר." },
            ],
            testQ: "What does Tali say when she greets the class?",
            testOpts: [
              { v: "a", t: "It's nice to meet you." },
              { v: "b", t: "No food, please." },
              { v: "c", t: "See you on Monday." },
            ],
            testAns: "a",
          },
          {
            id: "name",
            label: "Name",
            img: BASE + "name.png",
            meaning: "The word people use to call you.",
            meaningHe: "המילה שקוראים לך",
            labelHe: "שם",
            sentences: [
              { en: "My name is Tali.", he: "קוראים לי טלי." },
              { en: "I want your name.", he: "אני רוצה את השם שלך." },
            ],
            testQ: "What does Tali ask students to write?",
            testOpts: [
              { v: "a", t: "Your name" },
              { v: "b", t: "Your food" },
              { v: "c", t: "Your pencil only" },
            ],
            testAns: "a",
          },
          {
            id: "phone",
            label: "Phone- number",
            img: BASE + "phone-number.png",
            meaning: "Numbers you use to call someone.",
            meaningHe: "מספרים שמשתמשים בהם כדי להתקשר",
            labelHe: "מספר טלפון",
            sentences: [
              { en: "I want your phone number.", he: "אני רוצה את מספר הטלפון שלך." },
              { en: "Write your name, phone number and address.", he: "כתבו את השם, מספר הטלפון והכתובת." },
            ],
            testQ: "Does Tali want your phone number?",
            testOpts: [
              { v: "a", t: "Yes" },
              { v: "b", t: "No" },
            ],
            testAns: "a",
          },
          {
            id: "address",
            label: "Address",
            img: BASE + "address.png",
            meaning: "Where you live.",
            meaningHe: "המקום שבו אתה גר",
            labelHe: "כתובת",
            sentences: [
              { en: "I want your address.", he: "אני רוצה את הכתובת שלך." },
              { en: "Please write your name, phone number and address.", he: "כתבו את השם, מספר הטלפון והכתובת." },
            ],
            testQ: "Which word means where you live?",
            testOpts: [
              { v: "a", t: "Address" },
              { v: "b", t: "Pencil" },
              { v: "c", t: "Food" },
            ],
            testAns: "a",
          },
          {
            id: "pencil",
            label: "Pencil",
            img: BASE + "pencil.png",
            meaning: "Something you write with.",
            meaningHe: "משהו שכותבים איתו",
            labelHe: "עפרון",
            sentences: [
              { en: "You need a pencil.", he: "אתם צריכים עפרון." },
              { en: "Bring a book, a notebook and a pencil.", he: "הביאו ספר, מחברת ועפרון." },
            ],
            testQ: "What should students bring to class?",
            testOpts: [
              { v: "a", t: "A book, a notebook and a pencil" },
              { v: "b", t: "Only food" },
              { v: "c", t: "Only games" },
            ],
            testAns: "a",
          },
          {
            id: "food",
            label: "Food",
            img: BASE + "food.png",
            meaning: "Things you eat.",
            meaningHe: "דברים שאוכלים",
            labelHe: "אוכל",
            sentences: [
              { en: "No food, please.", he: "בלי אוכל, בבקשה." },
              { en: "Do not bring food to English class.", he: "אל תביאו אוכל לשיעור אנגלית." },
            ],
            testQ: "Can students bring food to class?",
            testOpts: [
              { v: "a", t: "Yes" },
              { v: "b", t: "No" },
            ],
            testAns: "b",
          },
        ];

        var activeWord = "meet";
        var activeMode = "learn";
        var testQueue = [];
        var testIndex = 0;
        var testChecked = false;
        var sectionShuffle = {};
        var flashQueue = [];
        var flashIndex = 0;

        function esc(s) {
          return String(s)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
        }

        function shuffle(arr) {
          var a = arr.slice();
          for (var i = a.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var t = a[i];
            a[i] = a[j];
            a[j] = t;
          }
          return a;
        }

        function wordById(id) {
          for (var i = 0; i < WORDS.length; i++) {
            if (WORDS[i].id === id) return WORDS[i];
          }
          return null;
        }

        function shuffleKey(wordId, mode) {
          return wordId + "-" + mode;
        }

        function getShuffledSentences(w, mode) {
          var key = shuffleKey(w.id, mode);
          if (!sectionShuffle[key]) {
            sectionShuffle[key] = shuffle([0, 1]);
          }
          return sectionShuffle[key].map(function (i) {
            return w.sentences[i];
          });
        }

        function resetShuffle(wordId, mode) {
          delete sectionShuffle[shuffleKey(wordId, mode)];
        }

        function sentencesHtml(sents) {
          return sents
            .map(function (s) {
              return (
                '<div class="sentence-pair">' +
                "<p><strong>English:</strong> &ldquo;" +
                esc(s.en) +
                "&rdquo;</p>" +
                '<p class="he-rtl"><strong>עברית:</strong> &ldquo;' +
                esc(s.he) +
                "&rdquo;</p>" +
                "</div>"
              );
            })
            .join("");
        }

        function buildLearnContent(w) {
          var sents = getShuffledSentences(w, "learn");
          return (
            '<div class="meaning-block">' +
            "<p><strong>Meaning:</strong> " +
            esc(w.meaning) +
            "</p>" +
            '<p class="he-rtl"><strong>משמעות:</strong> ' +
            esc(w.meaningHe) +
            "</p>" +
            "</div>" +
            "<p><strong>Two sentences we use this word in:</strong></p>" +
            sentencesHtml(sents) +
            '<button type="button" class="restart-btn" data-restart="learn">Restart</button>'
          );
        }

        function flashCardHtml(w) {
          return (
            '<div class="flashcard" tabindex="0" role="button" aria-label="Flip flashcard">' +
            '<div class="flashcard-inner">' +
            '<div class="flashcard-face flashcard-front">' +
            '<span class="flashcard-word">' +
            esc(w.label) +
            "</span></div>" +
            '<div class="flashcard-face flashcard-back">' +
            '<p class="flashcard-word-en" lang="en" dir="ltr">' +
            esc(w.label) +
            "</p>" +
            '<p class="flashcard-meaning-he" dir="rtl" lang="he">' +
            esc(w.meaningHe) +
            "</p>" +
            "</div></div></div>"
          );
        }

        function buildFlashDeckShell() {
          return (
            '<p class="flashcard-hint">Click the card to flip. Use the orange Next button on the right to go through all words.</p>' +
            '<p class="flash-progress" data-flash-progress></p>' +
            '<div class="flash-deck-row">' +
            '<div class="flash-deck-card-wrap" data-flash-card-wrap></div>' +
            '<button type="button" class="flash-next-btn" data-flash-next>Next →</button>' +
            "</div>" +
            '<div class="flash-deck-footer">' +
            '<p class="flash-done-msg" data-flash-done hidden style="margin:0;font-weight:700;color:var(--flash)"></p>' +
            '<button type="button" class="restart-btn" data-restart="flashcards">Restart</button>' +
            "</div>"
          );
        }

        function startFlashDeck(panel) {
          flashQueue = shuffle(
            WORDS.map(function (w) {
              return w.id;
            })
          );
          flashIndex = 0;
          var content = panel.querySelector('[data-content="flashcards"]');
          content.innerHTML = buildFlashDeckShell();
          renderFlashCard(panel);
        }

        function renderFlashCard(panel) {
          var wrap = panel.querySelector("[data-flash-card-wrap]");
          var progress = panel.querySelector("[data-flash-progress]");
          var nextBtn = panel.querySelector("[data-flash-next]");
          var doneMsg = panel.querySelector("[data-flash-done]");
          if (!wrap) return;

          doneMsg.hidden = true;

          if (flashIndex >= flashQueue.length) {
            progress.textContent = "All words done!";
            wrap.innerHTML = "";
            doneMsg.hidden = false;
            doneMsg.textContent = "You finished all " + flashQueue.length + " words. Press Restart for a new order.";
            nextBtn.hidden = true;
            return;
          }

          var w = wordById(flashQueue[flashIndex]);
          progress.textContent = "Word " + (flashIndex + 1) + " of " + flashQueue.length + ": " + w.label;
          wrap.innerHTML = flashCardHtml(w);
          setWord(w.id);
          nextBtn.hidden = false;
          nextBtn.disabled = false;
          nextBtn.textContent =
            flashIndex < flashQueue.length - 1 ? "Next →" : "Finish";
        }

        function buildTestShell() {
          return (
            '<div class="test-runner">' +
            '<p class="test-progress" data-test-progress></p>' +
            '<span class="test-word-tag" data-test-tag></span>' +
            '<p data-test-question></p>' +
            '<div class="test-options" data-test-options></div>' +
            '<p class="test-feedback" aria-live="polite" data-test-feedback></p>' +
            '<button type="button" class="test-nav-btn" data-test-check>Check answer</button>' +
            '<button type="button" class="test-nav-btn" data-test-next hidden>Next word</button>' +
            '<button type="button" class="restart-btn" data-restart="test">Restart test</button>' +
            '<div class="test-done" data-test-done hidden></div>' +
            "</div>"
          );
        }

        function buildPanel(w) {
          return (
            '<section class="panel' +
            (w.id === activeWord ? " is-active" : "") +
            '" data-word="' +
            w.id +
            '">' +
            '<div class="panel-head"><h2>' +
            esc(w.label) +
            '</h2><img class="panel-img" src="' +
            esc(w.img) +
            '" alt="' +
            esc(w.label) +
            '" loading="lazy" /></div>' +
            '<div class="mode-btns">' +
            '<button type="button" class="mode-btn is-active" data-mode="learn">Learn</button>' +
            '<button type="button" class="mode-btn" data-mode="flashcards">Flashcards</button>' +
            '<button type="button" class="mode-btn" data-mode="test">Test</button>' +
            "</div>" +
            '<div class="mode-panel is-active" data-mode-panel="learn">' +
            '<div class="section-block section-learn">' +
            '<p class="instr-en">Read the meaning and two English sentences. Then read the Hebrew.</p>' +
            '<p class="instr-he">קראו את המשמעות ואת שתי המשפטים באנגלית. אחר כך קראו את העברית. לחצו Start כדי להתחיל.</p>' +
            '<button type="button" class="start-btn start-btn--learn" data-start="learn">Start</button>' +
            '<div class="section-content" data-content="learn"></div></div></div>' +
            '<div class="mode-panel" data-mode-panel="flashcards">' +
            '<div class="section-block section-flashcards">' +
            '<p class="instr-en">Press Start, flip the card to see the Hebrew meaning, then press Next word on the right.</p>' +
            '<p class="instr-he">לחצו Start, הפכו את הכרטיס לראות את המשמעות בעברית, ואז Next word מימין.</p>' +
            '<button type="button" class="start-btn start-btn--flash" data-start="flashcards">Start</button>' +
            '<div class="section-content" data-content="flashcards"></div></div></div>' +
            '<div class="mode-panel" data-mode-panel="test">' +
            '<div class="section-block section-test">' +
            '<p class="instr-en">Press Start for a test on all six words (shuffled). Check each answer, then go to the next word.</p>' +
            '<p class="instr-he">לחצו Start לבחינה על כל שש המילים (בסדר אקראי). בדקו כל תשובה ואז עברו למילה הבאה.</p>' +
            '<button type="button" class="start-btn start-btn--test" data-start="test">Start</button>' +
            '<div class="section-content" data-content="test">' +
            buildTestShell() +
            "</div></div></div></section>"
          );
        }

        var panelsRoot = document.getElementById("panels");
        panelsRoot.innerHTML = WORDS.map(buildPanel).join("");

        function setWord(id) {
          activeWord = id;
          document.querySelectorAll(".word-tab").forEach(function (btn) {
            var on = btn.dataset.word === id;
            btn.classList.toggle("is-active", on);
            btn.setAttribute("aria-selected", on ? "true" : "false");
          });
          document.querySelectorAll(".panel").forEach(function (p) {
            p.classList.toggle("is-active", p.dataset.word === id);
          });
        }

        function setMode(panel, mode) {
          activeMode = mode;
          panel.querySelectorAll(".mode-btn").forEach(function (b) {
            b.classList.toggle("is-active", b.dataset.mode === mode);
          });
          panel.querySelectorAll(".mode-panel").forEach(function (p) {
            p.classList.toggle("is-active", p.dataset.modePanel === mode);
          });
        }

        function openSection(panel, mode) {
          var content = panel.querySelector('[data-content="' + mode + '"]');
          if (!content) return;
          content.classList.add("is-open");
          var w = wordById(panel.dataset.word);
          if (mode === "learn") content.innerHTML = buildLearnContent(w);
          if (mode === "flashcards") startFlashDeck(panel);
          if (mode === "test") startTest(panel);
          var startBtn = panel.querySelector('[data-start="' + mode + '"]');
          if (startBtn) startBtn.hidden = true;
        }

        function closeSection(panel, mode) {
          var content = panel.querySelector('[data-content="' + mode + '"]');
          if (content) {
            content.classList.remove("is-open");
            if (mode !== "test") content.innerHTML = "";
          }
          var startBtn = panel.querySelector('[data-start="' + mode + '"]');
          if (startBtn) startBtn.hidden = false;
        }

        function startTest(panel) {
          testQueue = shuffle(WORDS.map(function (w) {
            return w.id;
          }));
          testIndex = 0;
          testChecked = false;
          renderTestQuestion(panel);
        }

        function renderTestQuestion(panel) {
          var runner = panel.querySelector(".test-runner");
          if (!runner) return;
          var progress = runner.querySelector("[data-test-progress]");
          var tag = runner.querySelector("[data-test-tag]");
          var qEl = runner.querySelector("[data-test-question]");
          var opts = runner.querySelector("[data-test-options]");
          var fb = runner.querySelector("[data-test-feedback]");
          var checkBtn = runner.querySelector("[data-test-check]");
          var nextBtn = runner.querySelector("[data-test-next]");
          var done = runner.querySelector("[data-test-done]");

          done.hidden = true;
          fb.textContent = "";
          fb.className = "test-feedback";
          testChecked = false;
          checkBtn.hidden = false;
          nextBtn.hidden = true;

          if (testIndex >= testQueue.length) {
            progress.textContent = "Test complete!";
            tag.textContent = "";
            qEl.textContent = "";
            opts.innerHTML = "";
            checkBtn.hidden = true;
            done.hidden = false;
            done.textContent =
              "Well done! You finished all " + testQueue.length + " words. Press Restart test to try again in a new order.";
            return;
          }

          var w = wordById(testQueue[testIndex]);
          progress.textContent = "Question " + (testIndex + 1) + " of " + testQueue.length;
          tag.textContent = w.label;
          qEl.textContent = w.testQ;
          opts.innerHTML = w.testOpts
            .map(function (o) {
              return (
                '<label><input type="radio" name="test-run" value="' +
                o.v +
                '" /> ' +
                esc(o.t) +
                "</label>"
              );
            })
            .join("");
          checkBtn.dataset.answer = w.testAns;
        }

        document.querySelector(".word-tabs").addEventListener("click", function (e) {
          var tab = e.target.closest(".word-tab");
          if (tab) setWord(tab.dataset.word);
        });

        panelsRoot.addEventListener("click", function (e) {
          var panel = e.target.closest(".panel");
          if (!panel) return;

          var modeBtn = e.target.closest(".mode-btn");
          if (modeBtn) {
            setMode(panel, modeBtn.dataset.mode);
            return;
          }

          var startBtn = e.target.closest("[data-start]");
          if (startBtn) {
            openSection(panel, startBtn.dataset.start);
            return;
          }

          var restartBtn = e.target.closest("[data-restart]");
          if (restartBtn) {
            var mode = restartBtn.dataset.restart;
            var wid = panel.dataset.word;
            resetShuffle(wid, mode);
            if (mode === "test") {
              startTest(panel);
              return;
            }
            if (mode === "flashcards") {
              startFlashDeck(panel);
              return;
            }
            closeSection(panel, mode);
            openSection(panel, mode);
            return;
          }

          var flashNext = e.target.closest("[data-flash-next]");
          if (flashNext) {
            flashIndex++;
            renderFlashCard(panel);
            return;
          }

          var flash = e.target.closest(".flashcard");
          if (flash) {
            flash.classList.toggle("is-flipped");
            return;
          }

          var checkBtn = e.target.closest("[data-test-check]");
          if (checkBtn && !checkBtn.hidden) {
            var fb = panel.querySelector("[data-test-feedback]");
            var picked = panel.querySelector('input[name="test-run"]:checked');
            if (!picked) {
              fb.textContent = "Choose an answer first.";
              fb.className = "test-feedback is-bad";
              return;
            }
            if (picked.value === checkBtn.dataset.answer) {
              fb.textContent = "Correct!";
              fb.className = "test-feedback is-ok";
            } else {
              fb.textContent = "Not quite — try again.";
              fb.className = "test-feedback is-bad";
              return;
            }
            testChecked = true;
            checkBtn.hidden = true;
            panel.querySelector("[data-test-next]").hidden = false;
            return;
          }

          var nextBtn = e.target.closest("[data-test-next]");
          if (nextBtn && testChecked) {
            testIndex++;
            renderTestQuestion(panel);
          }
        });

        panelsRoot.addEventListener("keydown", function (e) {
          if (e.key !== "Enter" && e.key !== " ") return;
          var flash = e.target.closest(".flashcard");
          if (flash) {
            e.preventDefault();
            flash.classList.toggle("is-flipped");
          }
        });
      })();
    </script>
  </body>
</html>
