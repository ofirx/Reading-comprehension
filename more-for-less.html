<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>More for Less — יותר בפחות</title>
    <style>
      :root {
        --neon-red: #ff2a4a;
        --neon-red-glow: #ff073a;
        --neon-ice: #5cefff;
        --neon-ice-glow: #00e5ff;
        --bg: #0a0a12;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: #fff;
      }
      .deck {
        display: flex;
        flex-direction: column;
        height: 100%;
        min-height: 100dvh;
      }
      .slides-viewport {
        flex: 1;
        position: relative;
        overflow: hidden;
      }
      .slide {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 48px 24px 100px;
        opacity: 0;
        visibility: hidden;
        transform: translateX(40px) scale(0.98);
        transition:
          opacity 0.45s ease,
          transform 0.45s ease,
          visibility 0.45s;
      }
      .slide.is-active {
        opacity: 1;
        visibility: visible;
        transform: translateX(0) scale(1);
        z-index: 1;
      }
      .slide.is-exit-left {
        transform: translateX(-40px) scale(0.98);
        opacity: 0;
      }
      .slide--title {
        background:
          radial-gradient(ellipse 80% 50% at 20% 40%, rgba(255, 42, 74, 0.18), transparent 55%),
          radial-gradient(ellipse 70% 45% at 80% 60%, rgba(92, 239, 255, 0.2), transparent 55%),
          var(--bg);
        padding: 24px 16px 100px;
      }
      .title-pulse {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        transform-origin: center center;
        animation: heartbeat 2.6s ease-in-out infinite;
      }
      @keyframes heartbeat {
        0%,
        100% {
          transform: scale(1);
        }
        12% {
          transform: scale(1.09);
        }
        24% {
          transform: scale(1);
        }
        36% {
          transform: scale(1.06);
        }
        48% {
          transform: scale(1);
        }
      }
      @keyframes neon-throb-red {
        0%,
        100% {
          text-shadow:
            0 0 10px var(--neon-red-glow),
            0 0 28px var(--neon-red-glow),
            0 0 55px rgba(255, 7, 58, 0.85),
            0 0 100px rgba(255, 42, 74, 0.45);
        }
        12% {
          text-shadow:
            0 0 16px var(--neon-red-glow),
            0 0 42px var(--neon-red-glow),
            0 0 80px rgba(255, 7, 58, 1),
            0 0 140px rgba(255, 42, 74, 0.75);
        }
        36% {
          text-shadow:
            0 0 14px var(--neon-red-glow),
            0 0 36px var(--neon-red-glow),
            0 0 70px rgba(255, 7, 58, 0.95),
            0 0 120px rgba(255, 42, 74, 0.6);
        }
      }
      @keyframes neon-throb-ice {
        0%,
        100% {
          text-shadow:
            0 0 10px var(--neon-ice-glow),
            0 0 28px var(--neon-ice-glow),
            0 0 55px rgba(0, 229, 255, 0.85),
            0 0 100px rgba(92, 239, 255, 0.4);
        }
        12% {
          text-shadow:
            0 0 16px var(--neon-ice-glow),
            0 0 42px var(--neon-ice-glow),
            0 0 80px rgba(0, 229, 255, 1),
            0 0 140px rgba(92, 239, 255, 0.65);
        }
        36% {
          text-shadow:
            0 0 14px var(--neon-ice-glow),
            0 0 36px var(--neon-ice-glow),
            0 0 70px rgba(0, 229, 255, 0.95),
            0 0 120px rgba(92, 239, 255, 0.55);
        }
      }
      .neon-en {
        font-size: clamp(4rem, 16vmin, 11rem);
        font-weight: 900;
        line-height: 1.05;
        text-align: center;
        letter-spacing: 0.02em;
        margin-bottom: 0.2em;
        width: 100%;
      }
      .slide--content {
        background:
          radial-gradient(ellipse 60% 40% at 50% 100%, rgba(92, 239, 255, 0.08), transparent),
          var(--bg);
      }
      .neon-en .word-more,
      .neon-en .word-less {
        color: var(--neon-red);
        animation: neon-throb-red 2.6s ease-in-out infinite;
      }
      .neon-en .word-for {
        color: var(--neon-ice);
        animation: neon-throb-ice 2.6s ease-in-out infinite;
      }
      .neon-he {
        font-size: clamp(3.5rem, 14vmin, 9.5rem);
        font-weight: 900;
        line-height: 1.15;
        text-align: center;
        direction: rtl;
        letter-spacing: 0.02em;
        width: 100%;
      }
      .neon-he .he-more {
        color: var(--neon-red);
        animation: neon-throb-red 2.6s ease-in-out infinite;
      }
      .neon-he .he-less {
        color: var(--neon-ice);
        animation: neon-throb-ice 2.6s ease-in-out infinite;
      }
      .slide-body {
        max-width: 90%;
        text-align: center;
        font-size: clamp(1.8rem, 5vmin, 3rem);
        color: rgba(255, 255, 255, 0.85);
        line-height: 1.5;
      }
      .slide-body h2 {
        font-size: clamp(2.2rem, 7vmin, 4.5rem);
        margin-bottom: 20px;
        color: var(--neon-ice);
        text-shadow: 0 0 12px rgba(0, 229, 255, 0.5);
      }
      .slide-counter {
        position: absolute;
        top: 20px;
        right: 24px;
        font-size: 14px;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.45);
        z-index: 2;
      }
      .nav-bar {
        flex-shrink: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        padding: 20px 24px 28px;
        background: linear-gradient(to top, rgba(0, 0, 0, 0.85), transparent);
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }
      .nav-btn {
        min-width: 120px;
        padding: 14px 28px;
        border: 2px solid var(--neon-ice);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.06);
        color: #fff;
        font: inherit;
        font-size: 1rem;
        font-weight: 800;
        cursor: pointer;
        box-shadow:
          0 0 8px var(--neon-ice-glow),
          0 0 20px rgba(0, 229, 255, 0.45),
          0 0 40px rgba(92, 239, 255, 0.25);
        transition:
          background 0.2s,
          border-color 0.2s,
          box-shadow 0.2s,
          opacity 0.2s;
      }
      .nav-btn:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.12);
        border-color: var(--neon-ice);
        box-shadow:
          0 0 12px var(--neon-ice-glow),
          0 0 28px rgba(0, 229, 255, 0.65),
          0 0 50px rgba(92, 239, 255, 0.4);
      }
      .nav-btn:disabled {
        opacity: 0.35;
        cursor: not-allowed;
        box-shadow:
          0 0 6px rgba(0, 229, 255, 0.25),
          0 0 14px rgba(92, 239, 255, 0.15);
      }
      .nav-btn--next {
        border-color: var(--neon-ice);
      }
      .nav-btn--next:hover:not(:disabled) {
        border-color: var(--neon-ice);
        box-shadow:
          0 0 12px var(--neon-ice-glow),
          0 0 28px rgba(0, 229, 255, 0.65),
          0 0 50px rgba(92, 239, 255, 0.4);
      }
      .slide--traffic {
        background:
          radial-gradient(ellipse 50% 40% at 50% 50%, rgba(255, 255, 255, 0.04), transparent),
          var(--bg);
      }
      .traffic-light {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .traffic-housing {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(20px, 4vmin, 36px);
        padding: clamp(24px, 5vmin, 44px) clamp(28px, 6vmin, 52px);
        background: linear-gradient(180deg, #1a1a24 0%, #0d0d14 100%);
        border: 3px solid var(--neon-ice);
        border-radius: clamp(28px, 6vmin, 48px);
        box-shadow:
          0 0 12px var(--neon-ice-glow),
          0 0 28px rgba(0, 229, 255, 0.55),
          0 0 55px rgba(92, 239, 255, 0.35),
          inset 0 0 20px rgba(255, 255, 255, 0.04);
      }
      .traffic-bulb {
        width: clamp(80px, 18vmin, 140px);
        height: clamp(80px, 18vmin, 140px);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.06);
        border: 2px solid rgba(255, 255, 255, 0.1);
        opacity: 0.2;
        transition: opacity 0.3s ease;
      }
      .traffic-bulb--red {
        animation: traffic-red 4.5s step-end infinite;
      }
      .traffic-bulb--yellow {
        animation: traffic-yellow 4.5s step-end infinite;
      }
      .traffic-bulb--green {
        animation: traffic-green 4.5s step-end infinite;
      }
      @keyframes traffic-red {
        0%,
        33.32% {
          opacity: 1;
          background: #ff2a4a;
          border-color: #ff073a;
          box-shadow:
            0 0 15px #ff073a,
            0 0 35px #ff073a,
            0 0 70px rgba(255, 7, 58, 0.85),
            0 0 120px rgba(255, 42, 74, 0.5);
        }
        33.33%,
        100% {
          opacity: 0.2;
          background: rgba(255, 42, 74, 0.15);
          border-color: rgba(255, 7, 58, 0.25);
          box-shadow: none;
        }
      }
      @keyframes traffic-yellow {
        0%,
        33.32% {
          opacity: 0.2;
          background: rgba(255, 220, 80, 0.15);
          border-color: rgba(255, 220, 80, 0.25);
          box-shadow: none;
        }
        33.33%,
        66.65% {
          opacity: 1;
          background: #ffe566;
          border-color: #ffd60a;
          box-shadow:
            0 0 15px #ffd60a,
            0 0 35px #ffd60a,
            0 0 70px rgba(255, 214, 10, 0.85),
            0 0 120px rgba(255, 229, 102, 0.5);
        }
        66.66%,
        100% {
          opacity: 0.2;
          background: rgba(255, 220, 80, 0.15);
          border-color: rgba(255, 220, 80, 0.25);
          box-shadow: none;
        }
      }
      @keyframes traffic-green {
        0%,
        66.65% {
          opacity: 0.2;
          background: rgba(0, 255, 136, 0.12);
          border-color: rgba(0, 255, 136, 0.25);
          box-shadow: none;
        }
        66.66%,
        100% {
          opacity: 1;
          background: #00ff88;
          border-color: #00e676;
          box-shadow:
            0 0 15px #00e676,
            0 0 35px #00e676,
            0 0 70px rgba(0, 230, 118, 0.85),
            0 0 120px rgba(0, 255, 136, 0.5);
        }
      }
      .slide--pre {
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 48px clamp(12px, 2vw, 28px) 100px clamp(16px, 3vw, 40px);
        background:
          radial-gradient(ellipse 40% 50% at 15% 50%, rgba(255, 42, 74, 0.12), transparent),
          radial-gradient(ellipse 40% 50% at 85% 50%, rgba(255, 220, 80, 0.1), transparent),
          var(--bg);
      }
      .slide-pre-layout {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        width: 100%;
        max-width: 100%;
        gap: clamp(12px, 2.5vw, 28px);
      }
      .words-grid-layout {
        display: grid;
        grid-template-columns: auto auto;
        grid-template-rows: auto auto auto auto;
        column-gap: clamp(64px, 18vw, 240px);
        row-gap: 0;
        align-items: start;
        align-self: center;
      }
      .word-re {
        grid-column: 1;
        grid-row: 1;
      }
      .word-restart {
        grid-column: 2;
        grid-row: 1;
      }
      .word-replay {
        grid-column: 2;
        grid-row: 2;
      }
      .word-pre {
        grid-column: 1;
        grid-row: 4;
      }
      .word-prepay {
        grid-column: 2;
        grid-row: 4;
        margin: 0;
      }
      .words-grid-layout::after {
        content: "";
        grid-column: 1 / -1;
        grid-row: 3;
        min-height: clamp(1.8rem, 5vmin, 3.2rem);
      }
      .compound-word {
        margin: 0;
        font-size: clamp(3.5rem, 12vmin, 8rem);
        font-weight: 900;
        line-height: 1;
        white-space: nowrap;
      }
      .compound-word--top {
        font-size: clamp(4rem, 14vmin, 9rem);
      }
      .neon-red-word {
        color: var(--neon-red);
        animation: neon-throb-red 2.6s ease-in-out infinite;
      }
      .neon-yellow-word {
        color: #ffe566;
        animation: neon-throb-yellow 2.6s ease-in-out infinite;
      }
      @keyframes neon-throb-yellow {
        0%,
        100% {
          text-shadow:
            0 0 10px #ffd60a,
            0 0 28px #ffd60a,
            0 0 55px rgba(255, 214, 10, 0.85),
            0 0 100px rgba(255, 229, 102, 0.45);
        }
        12% {
          text-shadow:
            0 0 16px #ffd60a,
            0 0 42px #ffd60a,
            0 0 80px rgba(255, 214, 10, 1),
            0 0 140px rgba(255, 229, 102, 0.7);
        }
        36% {
          text-shadow:
            0 0 14px #ffd60a,
            0 0 36px #ffd60a,
            0 0 70px rgba(255, 214, 10, 0.95),
            0 0 120px rgba(255, 229, 102, 0.55);
        }
      }
      .traffic-bulb--slide3-red {
        animation: slide3-red-bulb 3s ease-in-out infinite;
      }
      .traffic-bulb--slide3-yellow {
        animation: slide3-yellow-bulb 3s ease-in-out infinite;
      }
      @keyframes slide3-red-bulb {
        0%,
        49.99% {
          opacity: 1;
          background: #ff2a4a;
          border-color: #ff073a;
          box-shadow:
            0 0 15px #ff073a,
            0 0 35px #ff073a,
            0 0 70px rgba(255, 7, 58, 0.85),
            0 0 120px rgba(255, 42, 74, 0.5);
        }
        50%,
        100% {
          opacity: 0.2;
          background: rgba(255, 42, 74, 0.15);
          border-color: rgba(255, 7, 58, 0.25);
          box-shadow: none;
        }
      }
      @keyframes slide3-yellow-bulb {
        0%,
        49.99% {
          opacity: 0.2;
          background: rgba(255, 220, 80, 0.15);
          border-color: rgba(255, 220, 80, 0.25);
          box-shadow: none;
        }
        50%,
        100% {
          opacity: 1;
          background: #ffe566;
          border-color: #ffd60a;
          box-shadow:
            0 0 15px #ffd60a,
            0 0 35px #ffd60a,
            0 0 70px rgba(255, 214, 10, 0.85),
            0 0 120px rgba(255, 229, 102, 0.5);
        }
      }
      .pre-word-top {
        font-size: clamp(4rem, 14vmin, 9rem);
        font-weight: 900;
        line-height: 1;
        color: var(--neon-red);
        animation: neon-throb-red 2.6s ease-in-out infinite;
      }
      .pre-word-bottom {
        font-size: clamp(3.5rem, 12vmin, 8rem);
        font-weight: 900;
        line-height: 1;
        color: var(--neon-red);
        animation: neon-throb-red 2.6s ease-in-out infinite;
      }
      .slide-pre-layout .traffic-light {
        flex-shrink: 0;
        justify-self: end;
        align-self: center;
      }
      .slide--pre .traffic-bulb {
        width: clamp(56px, 12vmin, 100px);
        height: clamp(56px, 12vmin, 100px);
      }
      .slide--pre .traffic-housing {
        padding: clamp(18px, 4vmin, 32px) clamp(20px, 4.5vmin, 36px);
        gap: clamp(14px, 3vmin, 24px);
      }
      .traffic-bulb--blink-red {
        animation: red-blink 1.5s ease-in-out infinite;
      }
      .traffic-bulb--off {
        opacity: 0.2;
        background: rgba(255, 255, 255, 0.06);
        border-color: rgba(255, 255, 255, 0.1);
        box-shadow: none;
      }
      @keyframes red-blink {
        0%,
        45% {
          opacity: 1;
          background: #ff2a4a;
          border-color: #ff073a;
          box-shadow:
            0 0 15px #ff073a,
            0 0 35px #ff073a,
            0 0 70px rgba(255, 7, 58, 0.85),
            0 0 120px rgba(255, 42, 74, 0.5);
        }
        50%,
        100% {
          opacity: 0.25;
          background: rgba(255, 42, 74, 0.15);
          border-color: rgba(255, 7, 58, 0.25);
          box-shadow: none;
        }
      }
      @media (max-width: 640px) {
        .slide-pre-layout {
          grid-template-columns: 1fr;
          grid-template-rows: auto auto;
          justify-items: center;
          gap: 24px;
        }
        .words-grid-layout {
          column-gap: clamp(32px, 10vw, 64px);
          justify-items: center;
        }
        .word-re,
        .word-pre,
        .word-restart,
        .word-replay,
        .word-prepay {
          justify-self: center;
        }
        .slide-pre-layout .traffic-light {
          justify-self: center;
        }
      }
    </style>
  </head>
  <body>
    <div class="deck">
      <div class="slides-viewport" id="viewport">
        <p class="slide-counter" id="counter" aria-live="polite">1 / 1</p>

        <section class="slide slide--title is-active" data-slide="0" aria-hidden="false">
          <div class="title-pulse">
            <h1 class="neon-en" lang="en">
              <span class="word-more">more</span>
              <span class="word-for"> for </span>
              <span class="word-less">less</span>
            </h1>
            <p class="neon-he" lang="he" dir="rtl">
              <span class="he-more">יותר</span>
              <span class="he-less"> בפחות</span>
            </p>
          </div>
        </section>

        <section class="slide slide--content slide--traffic" data-slide="1" aria-hidden="true">
          <div class="traffic-light" role="img" aria-label="Neon traffic light cycling red, yellow, and green every one and a half seconds">
            <div class="traffic-housing">
              <span class="traffic-bulb traffic-bulb--red" aria-hidden="true"></span>
              <span class="traffic-bulb traffic-bulb--yellow" aria-hidden="true"></span>
              <span class="traffic-bulb traffic-bulb--green" aria-hidden="true"></span>
            </div>
          </div>
        </section>

        <section class="slide slide--content slide--pre" data-slide="2" aria-hidden="true">
          <div class="slide-pre-layout">
            <div class="words-grid-layout">
              <span class="pre-word-top word-re" lang="en">re</span>
              <p class="compound-word compound-word--top word-restart" lang="en">
                <span class="neon-red-word">re</span><span class="neon-yellow-word">start</span>
              </p>
              <p class="compound-word word-replay" lang="en">
                <span class="neon-red-word">re</span><span class="neon-yellow-word">play</span>
              </p>
              <span class="pre-word-bottom word-pre" lang="en">pre</span>
              <p class="compound-word word-prepay" lang="en">
                <span class="neon-red-word">pre</span><span class="neon-yellow-word">pay</span>
              </p>
            </div>
            <div class="traffic-light" role="img" aria-label="Traffic light blinking red then yellow every one and a half seconds">
              <div class="traffic-housing">
                <span class="traffic-bulb traffic-bulb--slide3-red" aria-hidden="true"></span>
                <span class="traffic-bulb traffic-bulb--slide3-yellow" aria-hidden="true"></span>
                <span class="traffic-bulb traffic-bulb--off" aria-hidden="true"></span>
              </div>
            </div>
          </div>
        </section>
      </div>

      <nav class="nav-bar" aria-label="Slide navigation">
        <button type="button" class="nav-btn" id="btnBack" disabled>Back</button>
        <button type="button" class="nav-btn nav-btn--next" id="btnNext">Next</button>
      </nav>
    </div>

    <script>
      (function () {
        var slides = document.querySelectorAll(".slide");
        var counter = document.getElementById("counter");
        var btnBack = document.getElementById("btnBack");
        var btnNext = document.getElementById("btnNext");
        var index = 0;
        var total = slides.length;

        function updateUI() {
          slides.forEach(function (slide, i) {
            var active = i === index;
            slide.classList.toggle("is-active", active);
            slide.setAttribute("aria-hidden", active ? "false" : "true");
          });
          counter.textContent = index + 1 + " / " + total;
          btnBack.disabled = index === 0;
          btnNext.disabled = index >= total - 1;
        }

        function go(delta) {
          var next = index + delta;
          if (next < 0 || next >= total) return;
          index = next;
          updateUI();
        }

        btnBack.addEventListener("click", function () {
          go(-1);
        });
        btnNext.addEventListener("click", function () {
          go(1);
        });

        document.addEventListener("keydown", function (e) {
          if (e.key === "ArrowRight" || e.key === "PageDown") {
            e.preventDefault();
            go(1);
          } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
            e.preventDefault();
            go(-1);
          }
        });

        updateUI();
      })();
    </script>
  </body>
</html>
